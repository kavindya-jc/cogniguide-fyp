<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playfului/components/bundle.css">
<script src="ds/playfului/components/bundle.js"></script>
<link rel="stylesheet" href="cg-theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="cg-screen" style="width: 390px; height: 844px; padding: 16px 24px 28px; gap: 20px">
  <div style="display: flex; align-items: center; min-height: 48px">
    <a class="pu-iconbtn pu-iconbtn-soft cg-ib" href="Main.dc.html" aria-label="Back">
      <x-import component-from-global-scope="PlayfulUI.Icon" name="arrow-left" size="{{i22}}"></x-import>
    </a>
  </div>

  <div class="cg-rise" style="display: flex; flex-direction: column; gap: 6px">
    <h1 class="h1">Create your account</h1>
    <p class="body muted" style="margin: 0">No name or email needed. Just a code and a password.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
    <div class="cg-field cg-rise d1">
      <label for="code">Anonymous code</label>
      <input id="code" class="cg-input" type="text" placeholder="For example P001" autocomplete="username" aria-describedby="code-help">
      <p id="code-help" class="cg-help">Letters and numbers only. Please don't use your real name.</p>
    </div>
    <div class="cg-field cg-rise d2">
      <label for="pw">Password</label>
      <input id="pw" class="cg-input" type="password" autocomplete="new-password" aria-describedby="pw-help">
      <p id="pw-help" class="cg-help">At least 8 characters.</p>
    </div>
    <div class="cg-field cg-rise d3">
      <label for="pw2">Type the password again</label>
      <input id="pw2" class="cg-input" type="password" autocomplete="new-password">
    </div>
  </form>

  <div class="cg-notice cg-rise d4" role="note">
    <span class="cg-well" style="background: var(--mustard); color: var(--on-accent)" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </span>
    <p class="body" style="margin: 0; font-size: 15px; line-height: 22px">Write your code and password down. Because we don't know who you are, we can't recover them.</p>
  </div>

  <div style="flex: 1"></div>
  <div class="cg-rise d5" style="display: flex; flex-direction: column; gap: 6px; align-items: center">
    <a class="pu-btn pu-btn-dark cg-lg cg-block" href="Home.dc.html">Create account</a>
    <a class="pu-btn pu-btn-ghost cg-lg" href="Login.dc.html" style="color: var(--teal-ink)">I already have an account</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { i22: 22 };
  }
}
</script>
</body>
</html>
