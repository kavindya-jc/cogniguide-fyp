<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a language</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playfului/components/bundle.css">
<script src="ds/playfului/components/bundle.js"></script>
<link rel="stylesheet" href="cg-theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Noto+Sans+Sinhala:wght@400;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="cg-screen" style="width: 390px; height: 844px; padding: 16px 24px 28px; gap: 20px">
  <div style="display: flex; align-items: center; min-height: 48px">
    <a class="pu-iconbtn pu-iconbtn-soft cg-ib" href="{{backHref}}" aria-label="Back">
      <x-import component-from-global-scope="PlayfulUI.Icon" name="arrow-left" size="{{i22}}"></x-import>
    </a>
  </div>

  <div class="cg-rise" style="display: flex; flex-direction: column; gap: 6px">
    <h1 id="lang-title" class="h1">Choose a language</h1>
    <p class="body muted" style="margin: 0">You can change this any time in Settings.</p>
  </div>

  <div role="radiogroup" aria-labelledby="lang-title" style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
      <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
        <button type="button" role="radio" aria-checked="true" class="cg-focus cg-rise {{l.delay}}" onClick="{{l.pick}}" style="width: 100%; min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--surface-raised); border: 0; box-shadow: inset 0 0 0 2.5px var(--night); border-radius: var(--radius-md); font-family: var(--font-sans); color: var(--ink); text-align: left; cursor: pointer">
          <span style="flex: 1; display: flex; flex-direction: column"><span class="title" style="font-size: 19px">{{l.native}}</span><span class="caption muted" style="font-size: 15px">{{l.english}}</span></span>
          <span aria-hidden="true" class="cg-pop" style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: var(--night); color: var(--on-night); display: grid; place-items: center">
            <x-import component-from-global-scope="PlayfulUI.Icon" name="check" size="{{i18}}"></x-import>
          </span>
        </button>
      </sc-if>
      <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
        <button type="button" role="radio" aria-checked="false" class="cg-focus cg-rise {{l.delay}}" onClick="{{l.pick}}" style="width: 100%; min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--surface-raised); border: 0; border-radius: var(--radius-md); font-family: var(--font-sans); color: var(--ink); text-align: left; cursor: pointer">
          <span style="flex: 1; display: flex; flex-direction: column"><span class="title" style="font-size: 19px">{{l.native}}</span><span class="caption muted" style="font-size: 15px">{{l.english}}</span></span>
          <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--field-line)"></span>
        </button>
      </sc-if>
    </sc-for>
  </div>

  <div class="cg-notice cg-notice-teal cg-rise d4" role="note">
    <span class="cg-well" style="background: var(--surface-raised); color: var(--teal-ink)" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg>
    </span>
    <p class="body" style="margin: 0">Your coach may answer in English first while we test Sinhala and Tamil.</p>
  </div>

  <div style="flex: 1"></div>
  <a class="pu-btn pu-btn-dark cg-lg cg-block" href="{{backHref}}">Done</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"backHref":{"editor":null,"default":"Main.dc.html"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const chosen = s.lang || 'en';
    const list = [
      { id: 'en', native: 'English', english: 'English' },
      { id: 'si', native: 'සිංහල', english: 'Sinhala' },
      { id: 'ta', native: 'தமிழ்', english: 'Tamil' }
    ];
    return {
      i18: 18,
      i22: 22,
      backHref: this.props.backHref ?? 'Main.dc.html',
      langs: list.map((l, i) => ({
        native: l.native,
        english: l.english,
        delay: 'd' + (i + 1),
        on: l.id === chosen,
        off: l.id !== chosen,
        pick: () => this.setState({ lang: l.id })
      }))
    };
  }
}
</script>
</body>
</html>
