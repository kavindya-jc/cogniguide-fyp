  <div id="login-err" class="cg-notice cg-nudge" role="alert">

  </div>

  <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
    <div class="cg-field">
      <label for="code">Anonymous code</label>
      <input id="code" class="cg-input" type="text" value="P01" aria-invalid="true" aria-describedby="login-err">
    </div>
    <div class="cg-field">
      <label for="pw">Password</label>
      <input id="pw" class="cg-input" type="password" value="password1" aria-invalid="true" aria-describedby="login-err">
    </div>
  </form>

  <div class="cg-notice cg-notice-teal" role="note">
    <span class="cg-well" style="background: var(--teal); color: var(--on-teal)" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>

  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
    <a class="pu-btn pu-btn-dark cg-lg cg-block" href="LoggingIn.dc.html">Log in</a>
    <a class="pu-btn pu-btn-ghost cg-lg" href="CreateAccount.dc.html" style="color: var(--teal-ink)">New here? Create an account</a>
  </div>
